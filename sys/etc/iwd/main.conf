[General]
# iwd applies the address itself, at the moment association completes.
# Without this it associates and then stops, leaving the interface with no
# address -- and the only sign is one line in /var/log/iwd.log:
# "station: Network configuration is disabled".
#
# set_ip depends on this. It used to run iwd, sleep, then add the address
# with ip(8), which was a guess at how long association takes. The address
# now lives in the network's own file under /var/lib/iwd, in an [IPv4]
# section; networks without one get DHCP.
EnableNetworkConfiguration=true

[Network]
# Do not write a resolv.conf. The alternatives iwd offers here are
# systemd-resolved and resolvconf, neither of which exists in this image.
NameResolvingService=none
